name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Fetch 7-Zip (the same build the image ships) for the unpack tests
        run: |
          mkdir -p /tmp/7z
          (curl -fsSL -o /tmp/7z.tar.xz https://github.com/ip7z/7zip/releases/download/25.01/7z2501-linux-x64.tar.xz \
            || curl -fsSL -o /tmp/7z.tar.xz https://github.com/ip7z/7zip/releases/download/24.09/7z2409-linux-x64.tar.xz)
          tar -xJf /tmp/7z.tar.xz -C /tmp/7z
          echo "HYVEMYND_7Z=/tmp/7z/7zzs" >> "$GITHUB_ENV"
      - name: Fetch par2 (the same build the image ships) for the repair tests
        run: |
          curl -fsSL -o /tmp/par2.zip https://github.com/animetosho/par2cmdline-turbo/releases/download/v1.5.0/par2cmdline-turbo-1.5.0-linux-amd64.zip
          mkdir -p /tmp/par2 && unzip -o /tmp/par2.zip -d /tmp/par2 && chmod 755 /tmp/par2/par2
          echo "HYVEMYND_PAR2=/tmp/par2/par2" >> "$GITHUB_ENV"
      - run: go test -race ./...
      - name: Validate Unraid template
        run: python3 -c "import xml.dom.minidom as m; m.parse('unraid/undermynd.xml'); m.parse('unraid/hyvemynd.xml')"
      - name: Build container
        run: docker build -t undermynd:ci .
      - name: Smoke test the container (starts, creates the database and a backup)
        run: |
          mkdir -p smoke/config smoke/data && chmod -R 777 smoke
          docker run -d --name smoke -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$PWD/smoke/config:/config" -v "$PWD/smoke/data:/data" undermynd:ci
          for i in $(seq 1 30); do
            if docker logs smoke 2>&1 | grep -q "backed up to"; then break; fi
            sleep 1
          done
          docker logs smoke 2>&1 | grep -E "database|listening"
          test -f smoke/config/undermynd.db
          ls smoke/config/backups/undermynd-*.db
          docker exec smoke /undermynd healthcheck
          docker rm -f smoke
      - name: The image's 7-Zip unpacks a RAR
        run: |
          mkdir -p rar && chmod 777 rar
          HYVEMYND_SAMPLE_RAR="$PWD/rar" go test -run TestWriteSampleRAR ./internal/usenet/
          docker run --rm -v "$PWD/rar:/w" --entrypoint /7zzs undermynd:ci x -y -o/w/out /w/sample.rar
          cmp rar/out/sample.mkv rar/sample.mkv
      - name: The image's par2 repairs a damaged file
        run: |
          mkdir -p p2 && chmod 777 p2
          head -c 2000000 /dev/urandom > p2/v.mkv && cp p2/v.mkv p2/orig.mkv
          docker run --rm -v "$PWD/p2:/w" --entrypoint /par2 undermynd:ci c -q -r10 /w/v.par2 /w/v.mkv
          dd if=/dev/zero of=p2/v.mkv bs=1000 seek=100 count=50 conv=notrunc
          docker run --rm -v "$PWD/p2:/w" --entrypoint /par2 undermynd:ci r -p /w/v.par2
          cmp p2/v.mkv p2/orig.mkv

  publish:
    name: Publish image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: undermynd-container-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/z354prance/undermynd:latest
            ghcr.io/z354prance/undermynd:sha-${{ github.sha }}
            ghcr.io/z354prance/hyvemynd:latest
            ghcr.io/z354prance/hyvemynd:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/z354prance/undermynd
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
