name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Validate Unraid template
        run: python3 -c "import xml.dom.minidom as m; m.parse('unraid/undermynd.xml')"
      - name: Build container
        run: docker build -t undermynd:ci .
      - name: Smoke test the container (starts, creates the database and a backup)
        run: |
          mkdir -p smoke/config smoke/data && chmod -R 777 smoke
          docker run -d --name smoke -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$PWD/smoke/config:/config" -v "$PWD/smoke/data:/data" undermynd:ci
          for i in $(seq 1 30); do
            if docker logs smoke 2>&1 | grep -q "backed up to"; then break; fi
            sleep 1
          done
          docker logs smoke 2>&1 | grep -E "database|listening"
          test -f smoke/config/undermynd.db
          ls smoke/config/backups/undermynd-*.db
          docker exec smoke /undermynd healthcheck
          docker rm -f smoke

  publish:
    name: Publish image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: undermynd-container-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/z354prance/undermynd:latest
            ghcr.io/z354prance/undermynd:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/z354prance/undermynd
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
