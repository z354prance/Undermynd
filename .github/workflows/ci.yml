name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unraid template
        run: python3 -c "import xml.dom.minidom as m; m.parse('unraid/undermynd.xml')"
      - name: Build container
        if: hashFiles('Dockerfile') != ''
        run: docker build -t undermynd:ci .

  publish:
    name: Publish image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('Dockerfile') != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: undermynd-container-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/z354prance/undermynd:latest
            ghcr.io/z354prance/undermynd:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/z354prance/undermynd
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
