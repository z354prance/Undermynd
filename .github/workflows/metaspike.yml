# Roadmap B3 spike. Runs only on the spike branch; never merged.
name: Metadata spike
on:
  push:
    branches: ["spike/b3-metadata"]
jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Run the spike
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: go run ./tools/metaspike | tee report.md
      - name: Job summary
        if: always()
        run: test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || true
