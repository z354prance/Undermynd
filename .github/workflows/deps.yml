# Temporary, for the SQLite branch only: the build machine that writes this code
# cannot reach the Go module proxy, so CI resolves the new dependency and commits
# go.mod and go.sum. Remove before merging.
name: Resolve Go modules
on:
  push:
    branches: ["feat/sqlite-store"]
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Newest modernc.org/sqlite that builds with Go 1.24
        env:
          GOTOOLCHAIN: local
        run: |
          if grep -q 'modernc.org/sqlite ' go.mod; then go mod tidy; exit 0; fi
          for v in $(go list -m -versions modernc.org/sqlite | tr ' ' '\n' | grep '^v1\.' | sort -V -r); do
            if go get "modernc.org/sqlite@$v" && go mod tidy && go build ./...; then echo "using $v"; exit 0; fi
            git checkout -- go.mod go.sum 2>/dev/null || true
          done
          exit 1
      - name: Commit go.mod and go.sum
        run: |
          if git diff --quiet -- go.mod go.sum; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "go.mod: add modernc.org/sqlite (resolved by CI)"
          git push
