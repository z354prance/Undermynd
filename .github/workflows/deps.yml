# Temporary, for the Go upgrade branch only: the machine that writes this code
# cannot reach the Go module proxy, so CI updates go.mod and go.sum. Remove before merging.
name: Resolve Go modules
on:
  push:
    branches: ["chore/go-1.27"]
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Move to Go 1.27 and the newest SQLite driver
        env:
          GOTOOLCHAIN: local
        run: |
          go mod edit -go=1.27.0 -toolchain=none
          go get modernc.org/sqlite@latest
          go mod tidy
          go build ./...
          grep -E '^go |modernc.org/sqlite ' go.mod
      - name: Commit go.mod and go.sum
        run: |
          if git diff --quiet -- go.mod go.sum; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "go.mod: Go 1.27 and the newest modernc.org/sqlite (resolved by CI)"
          git push
